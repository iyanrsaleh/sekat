# Salinan aturan .htaccess untuk Nginx. Ubah root dan server_name.
# Document root adalah folder framework, bukan public/.
# vendor/, deps/, dan .env tidak boleh terunduh.

server {
    listen 80;
    listen 443 ssl;
    server_name contoh.id;

    root /var/www/framework;
    index index.php;
    autoindex off;

    client_max_body_size 12m;

    location ~ /\.(env|git|htpasswd) {
        deny all;
    }

    location ~* \.(sql|log|pem|key|p12|bak|old|bat|sh|cmd|ini|yml|yaml)$ {
        deny all;
    }

    location ^~ /vendor/ { deny all; }
    location ^~ /deps/   { deny all; }
    location ^~ /build/  { deny all; }

    location = /composer.json { deny all; }
    location = /composer.lock { deny all; }
    location = /README.md     { deny all; }

    location ^~ /dashboard/assets/ {
        alias /var/www/framework/public/dashboard/assets/;
    }

    location ^~ /assets/ {
        alias /var/www/framework/public/assets/;
    }

    location ^~ /theme/assets/ {
        alias /var/www/framework/public/theme/assets/;
    }

    location ~* ^/(?!public/).+\.(?:css|js|mjs|map|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|json|txt|xml|webmanifest|pdf)$ {
        root /var/www/framework/public;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
