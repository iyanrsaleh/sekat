<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Sekat</title>
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <main>
    <h1>Sign Up</h1>
    <p>Buat akun baru lewat <code>api/auth/register</code>. Token langsung diberikan setelah berhasil.</p>

    <form id="signup-form" autocomplete="on">
      <label>
        Nama
        <input name="name" maxlength="120" required>
      </label>

      <label>
        Email
        <input name="email" type="email" required>
      </label>

      <label>
        Password
        <input name="password" type="password" minlength="8" required>
      </label>

      <div class="actions">
        <button type="submit">Daftar</button>
      </div>
    </form>

    <div id="g_id_onload"
         data-client_id="__GOOGLE_CLIENT_ID__"
         data-callback="handleGoogleSignIn"
         data-auto_prompt="false"
         data-ux_mode="popup"
         data-itp_support="true"
         data-context="signup"></div>
    <div class="g_id_signin"
         data-type="standard"
         data-size="medium"
         data-theme="outline"
         data-text="signup_with"
         data-shape="rectangular"
         data-logo_alignment="left"></div>

    <p id="message" role="status"></p>
    <pre id="output" hidden></pre>

    <p>Sudah punya akun? <a href="signin">Sign In</a></p>
    <p><a href="./">Kembali ke halaman utama</a></p>
  </main>

  <script src="assets/js/signup.js?v=2"></script>
  <script src="assets/js/google.js?v=4"></script>
</body>
</html>
