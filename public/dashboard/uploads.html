<header partial="header.html"></header>

  <div class="container pd-x-0">
    <div class="d-sm-flex align-items-center justify-content-between mg-b-20 mg-lg-b-25 mg-xl-b-30">
      <div>
        <h4 class="mg-b-0 tx-spacing--1">Upload</h4>
      </div>
    </div>

    <div class="row row-xs">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header">
            <h6 class="mg-b-0">Files</h6>
          </div>
          <div class="card-body">
            <p class="tx-color-03">Upload images (PNG/JPEG/WEBP, max 2 MB) or PDF documents (max 5 MB) to <code>POST api/uploads</code>. Admin login required.</p>

            <form id="upload-form">
              <div class="form-group">
                <label for="file">Select file</label>
                <input id="file" name="file" type="file" class="form-control" accept="image/png,image/jpeg,image/webp,application/pdf">
              </div>
              <button type="submit" class="btn btn-primary">Upload</button>
              <p id="message" class="mg-t-15 mg-b-0" role="status"></p>
            </form>
          </div>
        </div>

        <div class="card mg-t-20">
          <div class="card-header">
            <h6 class="mg-b-0">File list</h6>
          </div>
          <div class="card-body">
            <ul id="upload-list" class="mg-b-0"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="assets/js/uploads.js"></script>
<footer partial="footer.html"></footer>
