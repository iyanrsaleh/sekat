<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post — Sekat</title>
  <link rel="stylesheet" href="theme/assets/css/style.css?v=4">
</head>
<body>
  <header partial="header.html"></header>
  <main>
    <h1>Post</h1>
    <form id="post-form" autocomplete="off">
      <label>
        Judul
        <input name="title" maxlength="200" required>
      </label>
      <label>
        Isi
        <textarea name="body" rows="4" required></textarea>
      </label>
      <div class="actions">
        <button type="submit" id="submit-button">Tambah</button>
        <button type="button" id="cancel-button" hidden>Batal</button>
      </div>
    </form>
    <p id="message" role="status"></p>
    <ul id="post-list"></ul>
  </main>
  <footer partial="footer.html"></footer>
  <script src="assets/js/posts.js?v=3"></script>
</body>
</html>
