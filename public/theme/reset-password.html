<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password baru — Sekat</title>
  <link rel="stylesheet" href="theme/assets/css/style.css?v=4">
</head>
<body>
  <header partial="header.html"></header>
  <main>
    <h1>Password baru</h1>
    <form id="reset-form" autocomplete="on">
      <label>
        Password baru
        <input name="password" type="password" minlength="8" required>
      </label>
      <label>
        Ulangi password
        <input name="confirm" type="password" minlength="8" required>
      </label>
      <div class="actions">
        <button type="submit">Simpan</button>
      </div>
    </form>
    <p id="message" role="status"></p>
  </main>
  <footer partial="footer.html"></footer>
  <script src="assets/js/reset-password.js?v=1"></script>
</body>
</html>
