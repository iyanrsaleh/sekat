<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Sekat</title>
  <link rel="stylesheet" href="assets/css/style.css?v=2">
</head>
<body>
  <main>
    <h1>Password baru</h1>
    <p>Ganti password memakai tautan dari email.</p>

    <form id="reset-form" autocomplete="on">
      <label>
        Password baru
        <input name="password" type="password" minlength="8" required>
      </label>
      <label>
        Ulangi password
        <input name="confirm" type="password" minlength="8" required>
      </label>
      <div class="actions">
        <button type="submit">Simpan</button>
      </div>
    </form>

    <p id="message" role="status"></p>
    <p><a href="signin">Kembali ke Sign In</a></p>
  </main>

  <script src="assets/js/reset-password.js?v=1"></script>
</body>
</html>
