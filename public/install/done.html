<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instalasi Selesai — Sekat</title>
<link rel="stylesheet" href="assets/css/install.css">
</head>
<body>
<div class="install-container">
  <div class="install-card">
    <div class="install-header">
      <h1>Selesai</h1>
      <p>Sekat telah terinstal dan siap digunakan.</p>
    </div>

    <div class="status-box" style="justify-content:flex-start; text-align:left">
      <div>
        <div style="color:#16a34a; font-weight:600">&#10003; Konfigurasi database disimpan</div>
        <div style="color:#16a34a; font-weight:600">&#10003; Tabel database dibuat</div>
        <div style="color:#16a34a; font-weight:600">&#10003; Akun admin dibuat</div>
      </div>
    </div>

    <div class="actions" style="justify-content:flex-start; margin-top:24px">
      <p style="margin:0 0 12px 0; font-size:13px; color:#6b7280">Masuk ke dasbor admin:</p>
      <a href="../dashboard" class="btn btn-primary">Buka Dasbor</a>
    </div>

    <div style="margin-top:24px; padding-top:16px; border-top:1px solid #e5e7eb">
      <p style="margin:0; font-size:12px; color:#6b7280">
        Akun admin: <b>admin@example.com</b> / <b>admin123</b><br>
        Ganti sandi admin segera setelah masuk.
      </p>
    </div>
  </div>
</div>
</body>
</html>
